<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <div class="topnav">
        <div>
            <a href="main.html">Dashboard</a>
            <p>•</p>
            <a href="boards.html">Boards</a>
            <p>•</p>
            <a>Docs</a>
        </div>
        <div>
            <p>Username</p>
        </div>
        <div>
            <p>Search</p>
        </div>
    </div>
    </div>
    <main>
        <form id="noteForm">
            <label for="title" class="form-label">Title:</label>
            <input type="text" id="title" name="title" required>
            <label for="textContent" class="form-label">Content:</label>
            <textarea id="textContent" name="textContent" required></textarea>
            <label for="category" class="form-label">Category:</label>
            <input type="text" id="category" name="category" value="General">
            <button type="submit">Create Note</button>
        </form>
        <div id="notesBoard" class="board">

        </div>
        <script>
            document.getElementById('noteForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const title = document.getElementById('title').value;
                const textContent = document.getElementById('textContent').value;
                const category = document.getElementById('category').value;

                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        title: title, 
                        text_content: textContent, 
                        x_position: Math.floor(Math.random() * 500), //rand positions for testing, should be set by user in future :3
                        y_position: Math.floor(Math.random() * 500),
                        category: category 
                    })
                });

                if (!response.ok) throw new Error('Failed to create note');
                const createdNote = await response.json();
                console.log('Note created:', createdNote);
            })
            
            async function drawLoadNotes() {
                const response = await fetch('/api/notes');
                if (!response.ok) throw new Error('Failed to load notes :C');
                const notes = await response.json();
                const board = document.getElementById('notesBoard');
                board.innerHTML = ''; // clear old notes etc

                notes.forEach(note => {
                    const noteElement = document.createElement('div');
                    noteElement.className = 'note';
                    noteElement.style.left = note.x_position + 'px';
                    noteElement.style.top = note.y_position + 'px';
                    noteElement.textContent = note.title;
                    board.appendChild(noteElement);
                });
            }

            drawLoadNotes();
            setInterval(drawLoadNotes, 10); 
        </script>
    </main>
</body>
</html>

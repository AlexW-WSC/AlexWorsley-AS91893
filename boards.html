<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Board</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <div class="topnav">
        <div>
            <a href="main.html">Dashboard</a>
            <p>•</p>
            <a href="boards.html">Boards</a>
            <p>•</p>
            <a>Docs</a>
        </div>
        <div>
            <p>Username</p>
        </div>
        <div>
            <p>Search</p>
        </div>
    </div>
    <div class="boardUI">
        <div>
            <button><img src="/assets/refresh_icon.png" id="refreshButton"></button>
            <p>•</p>
            <button><img src="/assets/add_icon.png" id="addNoteButton"></button>
        </div>
        
        
    </div>
    <main>
        <div id="notesBoard" class="board">
            
            <div class="note">
                <div class="topbox">
                    <h3>Testing</h3>
                    <button type="button" class="delete-note" data-note-id="1"><img src="/assets/delete_icon.png"></button>
                </div>
                <p>This is a simple test note.</p>
                <span class="category">General</span>
            </div>
        </div>
        <script>
            
            document.getElementById('notesBoard').addEventListener('click', async (event) => {
                const deleteButton = event.target.closest('button.delete-note');
                if (!deleteButton) return;

                const noteId = deleteButton.dataset.noteId;
              
                try {
                    await deleteNote(noteId);
                } catch (error) {
                    console.error('client-side error deleting note:', error);
                }
            });

            function escapeHtmlCharacters(value = '') {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function isLikelyImageUrl(url = '') {
                try {
                    const parsedUrl = new URL(url);
                    const pathname = parsedUrl.pathname.toLowerCase();
                    const extension = pathname.split('.').pop()?.split('?')[0] || '';
                    const imageExtensions = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];

                    if (imageExtensions.includes(extension)) {
                        return true;
                    }

                    const host = parsedUrl.host.toLowerCase();
                    return host.includes('imgur')
                        || host.includes('unsplash')
                        || host.includes('pexels')
                        || host.includes('flickr')
                        || host.includes('cloudinary')
                        || pathname.includes('/image')
                        || pathname.includes('/images')
                        || pathname.includes('/img');
                } catch (error) {
                    return false;
                }
            }

            function renderNoteBodyContent(textContent = '') {
                const escapedText = escapeHtmlCharacters(textContent).replace(/\r?\n/g, '<br>');
                return escapedText.replace(/(https?:\/\/[^\s<>"']+)/gi, (match) => {
                    if (!isLikelyImageUrl(match)) {
                        return match;
                    }

                    const safeUrl = escapeHtmlCharacters(match);
                    return `<img src="${safeUrl}" alt="Embedded image" class="note-image">`;
                });
            }

            function getHighestNoteZIndex() {
                const board = document.getElementById('notesBoard');
                const notes = board.querySelectorAll('.note');
                let highestZIndex = 0;

                notes.forEach((existingNote) => {
                    const zIndex = Number.parseInt(existingNote.style.zIndex, 10) || 0;
                    if (zIndex > highestZIndex) {
                        highestZIndex = zIndex;
                    }
                });

                return highestZIndex;
            }

            function bringToTop(noteElement) {
                const nextNoteZIndex = getHighestNoteZIndex() + 1;
                noteElement.style.zIndex = String(nextNoteZIndex);

                const overlay = document.querySelector('.overlay');
                if (overlay) {
                    overlay.style.zIndex = String(nextNoteZIndex + 1);
                }
            }

            async function drawLoadNotes() {
                const response = await fetch('/api/notes');
                if (!response.ok) throw new Error('Failed to load notes :C');
                const notes = await response.json();
                const board = document.getElementById('notesBoard');
                board.innerHTML = ''; // clear old notes etc

                notes.forEach((note, index) => {
                    
                    const sizeDict = {
                        'Small': 0.8,
                        'Medium': 1.0,
                        'Large': 1.2,
                    }
                    
                    const noteElement = document.createElement('div');
                    noteElement.className = 'note';
                    noteElement.id = `note-${note.id}`;
                    noteElement.style.left = note.x_position + 'px';
                    noteElement.style.top = note.y_position + 'px';
                    noteElement.style.opacity = note.opacity;
                    noteElement.style.zIndex = String(index + 1);
                    const scale = sizeDict[note.size] || 1.0;
                    noteElement.style.transform = `scale(${scale})`;
                    noteElement.classList.add(note.category.toLowerCase());
                    noteElement.innerHTML = `
                        <div class="topbox">
                            <h3>${note.title}</h3>
                            <button type="button" class="delete-note" data-note-id="${note.id}"><img src="/assets/delete_icon.png"></button>
                        </div>
                        <div class="content">
                            <div class="note-body">${renderNoteBodyContent(note.text_content)}</div>
                            <span class="category">${note.category}</span>
                        </div>`;
                    board.appendChild(noteElement);

                    noteElement.addEventListener('mousedown', (event) => {
                        bringToTop(noteElement);
                        noteElement.style.userSelect = 'none';
                        const rect = noteElement.getBoundingClientRect();
                        const offsetX = event.clientX - rect.left;
                        const offsetY = event.clientY - rect.top;

                    

                        const board = document.getElementById('notesBoard');
                        const boardRect = board.getBoundingClientRect();

                        function onMouseMove(moveEvent) {
                            const x = moveEvent.clientX - boardRect.left - offsetX;
                            const y = moveEvent.clientY - boardRect.top - offsetY;
                            noteElement.style.left = x + 'px';
                            noteElement.style.top = y + 'px';
                        };

                        document.addEventListener('mousemove', onMouseMove);

                        async function onMouseUp() {
                            noteElement.style.userSelect = 'auto';
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);

                            const left = parseInt(noteElement.style.left, 10) || 0;
                            const top = parseInt(noteElement.style.top, 10) || 0;

                            try {
                                await fetch(`/api/notes/${note.id}`, {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ x_position: left, y_position: top })
                                    });
                                console.log('Note position updated:', { id: note.id, x_position: left, y_position: top });
                            } catch (error) {
                                console.error('client-side error updating note position :(', error);
                            }
                        }

                        document.addEventListener('mouseup', onMouseUp, { once: true });
                    });
                });
            }

            async function deleteNote(noteId) {
                const response = await fetch(`/api/notes/${noteId}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete note :C');
                console.log('Note deleted:', noteId);
                document.getElementById(`note-${noteId}`)?.remove();
            }

            drawLoadNotes();

            document.getElementById('refreshButton').addEventListener('click', () => {
                drawLoadNotes();
            });

            document.getElementById('addNoteButton').addEventListener('click', () => {
                const newOverlay = document.createElement('div');
                newOverlay.className = 'overlay';
                newOverlay.innerHTML = `
                    <div class="noteMenu">
                        <div class="topbox">
                            <div>
                                <button type="close">
                                    <img src="/assets/arrow_icon.png" class="closeOverlayButton" style="transform: scaleX(-1);">
                                </button>
                                <p>•</p>
                                <p>Back</p>
                            </div>
                            <div>
                                <input type="text" class="overlay-title" value="New Note" required>
                            </div>
                            <div>
                                <p>Confirm</p>
                                <p>•</p>
                                <button type="submit">
                                    <img src="/assets/confirm_icon.png" class="confirmNoteButton">
                                </button>
                            </div>
                        </div>
                        <div class="content">
                            <textarea class="overlay-content" required></textarea>
                        </div>
                        <div class="bottombox">
                            <div>
                                <p>Category:</p>
                                <select class="overlay-category">
                                    <option value="Subjects">Subjects</option>
                                    <option value="Events">Events</option>
                                    <option value="Personal">Personal</option>
                                    </select>
                                <p>Size:</p>
                                <select class="overlay-size">
                                    <option value="Small">Small</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Large">Large</option>
                                </select>
                                <p>Opacity(%):</p>
                                <input type="number" class="overlay-opacity" min="0" max="100" value="100">
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(newOverlay);
                newOverlay.style.zIndex = String(getHighestNoteZIndex() + 1);
                const categorySelect = newOverlay.querySelector('.overlay-category');

                function updateOverlayClass() {
                    newOverlay.classList.remove('subjects', 'events', 'personal');
                    newOverlay.classList.add(categorySelect.value.toLowerCase());
                }

                updateOverlayClass();
                categorySelect.addEventListener('change', updateOverlayClass);
                
                newOverlay.querySelector('.confirmNoteButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    const textContent = newOverlay.querySelector('.overlay-content').value;
                    const title = newOverlay.querySelector('.overlay-title').value;                    
                    const category = newOverlay.querySelector('.overlay-category').value;
                    const size = newOverlay.querySelector('.overlay-size').value;
                    const opacity = parseFloat(newOverlay.querySelector('.overlay-opacity').value) / 100;

                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        title: title,
                        text_content: textContent,
                        x_position: Math.floor(Math.random() * 500), 
                        y_position: Math.floor(Math.random() * 500),
                        category: category,
                        size: size,
                        opacity: opacity
                    })
                });

                if (!response.ok) throw new Error('Failed to create note');
                const createdNote = await response.json();
                console.log('Note created:', createdNote);
                drawLoadNotes();
                newOverlay.remove();
            })

                // Close button
                newOverlay.querySelector('.closeOverlayButton').addEventListener('click', () => {
                    newOverlay.remove();
                });
        });
        </script>
    </main>
</body>
</html>
